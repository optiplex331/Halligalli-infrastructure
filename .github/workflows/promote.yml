name: Target Promotion

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment Target whose desired state the promotion changes
        required: true
        type: choice
        options:
          - container-apps
          - aks
          - k3s
      release_tag:
        description: Formal Paired Release Tag to validate and propose
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  attestations: read

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Validate release and propose target Draft PR
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_REPOSITORY: optiplex331/Halligalli-BossYang

    steps:
      - name: Check out Infrastructure Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download public Paired Release Manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          curl --fail --location --silent --show-error
          "https://github.com/${PRODUCT_REPOSITORY}/releases/download/${RELEASE_TAG}/paired-release-manifest.json"
          --output paired-release-manifest.json

      - name: Prepare target-scoped Deployment Desired State
        id: promotion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ inputs.target }}
        run: >-
          python3 .github/utils/prepare_target_promotion.py
          --target "${TARGET}"
          --release-tag "${RELEASE_TAG}"
          --manifest paired-release-manifest.json
          --pr-body-output /tmp/promotion-pr.md

      - name: Verify paired artifact provenance and SBOM attestations
        if: steps.promotion.outputs.promotion_required == 'true'
        shell: bash
        env:
          API_IMAGE: ${{ steps.promotion.outputs.api_image }}
          WEB_IMAGE: ${{ steps.promotion.outputs.web_image }}
          COMMIT: ${{ steps.promotion.outputs.commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for image in "${WEB_IMAGE}" "${API_IMAGE}"; do
            for predicate_type in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
              gh attestation verify "oci://${image}" \
                --predicate-type "${predicate_type}" \
                --repo "${PRODUCT_REPOSITORY}" \
                --signer-workflow "${PRODUCT_REPOSITORY}/.github/workflows/build-images.yml" \
                --source-ref "refs/tags/${RELEASE_TAG}" \
                --source-digest "${COMMIT}" \
                --deny-self-hosted-runners
            done
          done

      - name: Create or update Draft target promotion PR
        if: steps.promotion.outputs.promotion_required == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: ${{ steps.promotion.outputs.promotion_branch }}
          base: main
          add-paths: ${{ steps.promotion.outputs.desired_state_path }}
          commit-message: ${{ steps.promotion.outputs.commit_message }}
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: ${{ steps.promotion.outputs.commit_message }}
          body-path: /tmp/promotion-pr.md
          draft: always-true
