name: Monitor Live Demo

on:
  # GitHub delivers this best-effort; runs were observed 3-5 hours apart.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-live-demo
  cancel-in-progress: true

jobs:
  report:
    name: Report Live Demo identity and drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report HTTPS, WebSocket, release identity, and desired-state drift
        run: python3 .github/utils/external_monitor.py --origin https://play.halligalli.games --report-only
