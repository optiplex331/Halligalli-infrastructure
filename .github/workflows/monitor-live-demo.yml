name: Monitor Live Demo

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-live-demo
  cancel-in-progress: true

jobs:
  public-uptime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check external HTTPS, WebSocket, and release identity
        run: python3 .github/utils/external_monitor.py --origin https://play.halligalli.games
