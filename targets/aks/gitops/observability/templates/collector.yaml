apiVersion: v1
kind: Service
metadata:
  name: halligalli-observability-collector
  labels:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: collector
spec:
  selector:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/component: collector
  ports:
    - name: http
      port: 4318
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halligalli-observability-collector
  labels:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halligalli-observability
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halligalli-observability
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: halligalli-observability
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "{{ .Values.collectorImage.repository }}@{{ .Values.collectorImage.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4318
          args: ["--config=/etc/otelcol/config.yaml"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: halligalli-observability-collector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: halligalli-observability-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlphttp/tempo:
        endpoint: http://halligalli-observability-tempo:4318
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlphttp/tempo]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: halligalli-observability-collector-flow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: halligalli-observability
      app.kubernetes.io/component: collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: halligalli
          podSelector:
            matchLabels:
              app.kubernetes.io/name: halligalli
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 4318
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: halligalli-observability
              app.kubernetes.io/component: tempo
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
