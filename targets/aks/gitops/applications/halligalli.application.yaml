apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: halligalli
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: halligalli
    app.kubernetes.io/part-of: aks
spec:
  project: default
  source:
    repoURL: https://github.com/optiplex331/Halligalli-infrastructure.git
    targetRevision: main
    path: targets/aks/gitops/halligalli
    helm:
      valueFiles:
        - values/aks.values.json
  destination:
    server: https://kubernetes.default.svc
    namespace: halligalli
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 10
