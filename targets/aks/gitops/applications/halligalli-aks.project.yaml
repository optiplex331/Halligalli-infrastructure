apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: halligalli-aks
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: infrastructure
spec:
  description: Halligalli runtime and observability on the AKS Deployment Target.
  sourceRepos:
    - https://github.com/optiplex331/Halligalli-infrastructure.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: halligalli
    - server: https://kubernetes.default.svc
      namespace: halligalli-observability
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: cert-manager.io
      kind: ClusterIssuer
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: cert-manager.io
      kind: Certificate
