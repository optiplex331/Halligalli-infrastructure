apiVersion: apps/v1
kind: Deployment
metadata:
  name: halligalli-web
  labels:
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: halligalli
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halligalli
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halligalli
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: halligalli-runtime
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: halligalli
              app.kubernetes.io/component: web
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}@{{ .Values.webImage.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HALLIGALLI_API_ORIGIN
              value: "http://halligalli-api"
          volumeMounts:
            - name: nginx-generated-config
              mountPath: /etc/nginx/conf.d
            - name: nginx-tmp
              mountPath: /tmp
          # Keep serving while the endpoint removal reaches every proxy, so requests that start
          # during a rollout are not routed to a Pod that already stopped.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-generated-config
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
