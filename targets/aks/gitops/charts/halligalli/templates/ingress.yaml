apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: halligalli
  labels:
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["{{ .Values.ingress.host }}"]
      secretName: "{{ .Values.ingress.tlsSecretName }}"
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: halligalli-api
                port:
                  name: http
          - path: /ws/v1
            pathType: Prefix
            backend:
              service:
                name: halligalli-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: halligalli-web
                port:
                  name: http
