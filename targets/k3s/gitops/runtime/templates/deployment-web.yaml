apiVersion: apps/v1
kind: Deployment
metadata:
  name: halligalli-web
  labels:
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: halligalli
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas.web }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halligalli
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halligalli
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: halligalli-runtime
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}@{{ .Values.webImage.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HALLIGALLI_API_ORIGIN
              value: "http://halligalli-api"
          volumeMounts:
            - name: nginx-generated-config
              mountPath: /etc/nginx/conf.d
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
{{- toYaml .Values.resources.web | nindent 12 }}
      volumes:
        - name: nginx-generated-config
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
