apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: halligalli-edge
  labels:
    app.kubernetes.io/name: halligalli-edge
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: halligalli-edge
      app.kubernetes.io/component: cloudflared
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: halligalli
          podSelector:
            matchLabels:
              app.kubernetes.io/name: halligalli
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 7844
