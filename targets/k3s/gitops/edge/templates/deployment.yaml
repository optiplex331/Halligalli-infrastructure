apiVersion: apps/v1
kind: Deployment
metadata:
  name: halligalli-cloudflared
  labels:
    app.kubernetes.io/name: halligalli-edge
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halligalli-edge
      app.kubernetes.io/component: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halligalli-edge
        app.kubernetes.io/part-of: halligalli
        app.kubernetes.io/component: cloudflared
    spec:
      serviceAccountName: halligalli-edge
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflaredImage.repository }}@{{ .Values.cloudflaredImage.digest }}"
          args: ["tunnel", "run", "--token", "$(TUNNEL_TOKEN)", "--metrics", "0.0.0.0:2000"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tunnel.secretName | quote }}
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          resources:
{{- toYaml .Values.resources | nindent 12 }}
