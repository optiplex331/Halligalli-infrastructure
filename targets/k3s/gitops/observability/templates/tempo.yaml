apiVersion: v1
kind: Service
metadata:
  name: halligalli-observability-tempo
  labels:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: tempo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/component: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halligalli-observability-tempo
  labels:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halligalli-observability
      app.kubernetes.io/component: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halligalli-observability
        app.kubernetes.io/part-of: halligalli
        app.kubernetes.io/component: tempo
    spec:
      serviceAccountName: halligalli-observability
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: "{{ .Values.tempoImage.repository }}@{{ .Values.tempoImage.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-http
              containerPort: 4318
          args: ["-config.file=/etc/tempo/config.yaml"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
{{- toYaml .Values.resources.tempo | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: halligalli-observability-tempo
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: halligalli-observability-tempo
  labels:
    app.kubernetes.io/name: halligalli-observability
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: halligalli-observability-tempo-flow
  labels:
    app.kubernetes.io/part-of: halligalli
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: halligalli-observability
      app.kubernetes.io/component: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3200
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: halligalli-observability
              app.kubernetes.io/component: collector
      ports:
        - protocol: TCP
          port: 4318
